<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You – Submission Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css?family=Montserrat:600,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        font-family: "Montserrat", sans-serif;
        text-align: center;
        background: linear-gradient(120deg, #f0f4ff 70%, #eaf6fa 100%);
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        padding: 0 10px;
    }

    /* LOADING SCREEN */
    .loading-overlay {
        position: fixed;
        top:0; left:0;
        width:100%; height:100%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:linear-gradient(120deg,#e8f0ff,#eaf6fa);
        z-index:9999;
        transition:opacity .4s ease;
    }
    .loader {
        border:7px solid #dce6ff;
        border-top:7px solid #3486fd;
        border-radius:50%;
        width:65px;
        height:65px;
        animation:spin 0.9s linear infinite;
        margin-bottom:18px;
    }
    @keyframes spin {
        0% { transform:rotate(0deg);}
        100% { transform:rotate(360deg);}
    }
    .loading-text {
        font-size:1.2rem;
        font-weight:700;
        color:#2764d6;
        margin-bottom:4px;
    }
    .loading-sub {
        color:#7a81ac;
        font-size:0.95rem;
    }

    /* SUCCESS CARD */
    .thank-card {
        max-width:450px;
        margin:80px auto 20px;
        padding:35px 25px;
        background:white;
        border-radius:18px;
        box-shadow:0 8px 38px rgba(30,60,140,0.12);
        display:none;
        animation:fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
        0% { opacity:0; transform:translateY(25px); }
        100% { opacity:1; transform:translateY(0); }
    }

    .success-icon {
        font-size:3rem;
        color:#22c55e;
        margin-bottom:12px;
        animation:pop 0.6s ease;
    }

    @keyframes pop {
        0% { transform:scale(0.3); opacity:0; }
        100% { transform:scale(1); opacity:1; }
    }

    .thank-title {
        font-size:1.6rem;
        font-weight:700;
        color:#2764d6;
        margin-bottom:8px;
    }

    .thank-message {
        color:#68759f;
        font-size:1rem;
        line-height:1.6;
        margin-bottom:20px;
    }

    /* BUTTONS */
    .actions {
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
    }

    .action-btn {
        padding:10px 18px;
        font-size:0.95rem;
        font-weight:600;
        border-radius:10px;
        text-decoration:none;
        color:white;
        background:linear-gradient(90deg,#3c87ff,#43c2e6);
        box-shadow:0 3px 12px rgba(32,128,200,0.15);
        display:flex;
        align-items:center;
        gap:6px;
    }

    .action-btn:hover {
        background:#2e78e4;
    }

    .secondary-btn {
        background:#eef4ff;
        color:#2764d6;
        box-shadow:none;
        border:1px solid #d8e2ff;
    }

    .secondary-btn:hover {
        background:#dce8ff;
    }

</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-overlay" id="loadingScreen">
    <div class="loader"></div>
    <div class="loading-text"><i class="fa fa-spinner fa-spin"></i> Saving your form...</div>
    <div class="loading-sub">Please wait, processing your data</div>
</div>

<!-- SUCCESS CARD -->
<div class="thank-card" id="thankCard">

    <div class="success-icon">
        <i class="fa fa-check-circle"></i>
    </div>

    <div class="thank-title">Thank You!</div>

    <p class="thank-message">
        Your information has been submitted successfully.  
        You can now continue to view your prediction.
    </p>

    <div class="actions">
        <a class="action-btn" href="{{ url_for('predict_page') }}">
            <i class="fa fa-chart-line"></i> View Prediction
        </a>

        <a class="action-btn secondary-btn" href="{{ url_for('home') }}">
            <i class="fa fa-house"></i> Dashboard
        </a>

        <a class="action-btn secondary-btn" href="{{ url_for('form_page') }}">
            <i class="fa fa-edit"></i> Submit Again
        </a>
    </div>

</div>

<script>
    // Show loader for 2.5 seconds, then show success card
    setTimeout(() => {
        document.getElementById("loadingScreen").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("loadingScreen").style.display = "none";
            document.getElementById("thankCard").style.display = "block";
        }, 400);
    }, 2500);
</script>

</body>
</html>
