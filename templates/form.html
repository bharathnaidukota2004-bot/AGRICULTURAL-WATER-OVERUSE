<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reducing Agricultural Water Overuse in India</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #065f46; /* Deep Forest Green */
      --primary-light: #059669; 
      --accent: #d1fae5; /* Pale Sage */
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --bg-light: #ffffff;
      --bg-off-white: #f9fafb;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-off-white);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* Top Banner Image */
    .top-banner {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    /* Navbar - Glassmorphism */
    nav {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      color: var(--text-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-left img {
      height: 40px;
      width: auto;
    }

    .nav-left span {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    /* Hero / Page Title */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 2.2rem; 
      font-weight: 700; 
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .hero p { 
      margin: 0; 
      color: var(--text-light); 
      font-size: 1.1rem;
    }

    /* Form Container */
    .form-container {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 850px;
      margin: 20px auto 80px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }

    .form-title {
      font-size: 1.4rem; 
      font-weight: 600; 
      color: var(--text-dark);
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-title i {
        color: var(--primary);
    }

    /* Grid Layout */
    .form-grid {
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 25px;
    }

    .form-group { display: flex; flex-direction: column; }

    label {
      font-size: 0.9rem; 
      color: var(--text-dark); 
      margin-bottom: 8px; 
      font-weight: 600;
    }

    input, select {
      padding: 12px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.95rem; 
      background: #f9fafb;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      color: var(--text-dark);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(6, 95, 70, 0.1); /* Green glow */
      outline: none;
    }

    /* Submit Button */
    .submit-btn {
      margin-top: 30px; 
      width: 100%;
      padding: 16px;
      background: var(--primary); 
      color: #fff;
      border: none; 
      border-radius: 50px;
      font-size: 1.05rem; 
      font-weight: 600; 
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .submit-btn:hover { 
      background: var(--primary-light); 
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 95, 70, 0.25);
    }

    /* Footer */
    .footer {
      text-align: center; 
      padding: 30px;
      color: var(--text-light); 
      font-size: 0.9rem; 
      background: #111827;
      margin-top: auto;
      color: #9ca3af;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-container { padding: 25px; margin: 20px; }
      .nav-links { display: none; } /* Simple hide for now, keeping it clean */
    }
  </style>
</head>

<body>

  <img src="{{ url_for('static', filename='header_image.jpg') }}" 
       alt="Header Image" 
       class="top-banner">

  <nav>
    <a href="#" class="nav-left">
      <img src="{{ url_for('static', filename='cmr_logo.png') }}" alt="CMR Logo">
      <span>Water Overuse Prediction</span>
    </a>

    <div class="nav-links">
      <a href="homepage.html">Home</a>
      <a href="#">About</a>
      <a href="models.html">Models</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1><i class="fas fa-water" style="font-size: 0.9em; margin-right: 10px;"></i>Reducing Agricultural Water Overuse</h1>
    <p>AI-powered irrigation optimization using Nash Equilibrium & Machine Learning</p>
  </section>

  <main class="form-container">
    <div class="form-title">
        <i class="fa fa-leaf"></i> Enter Farm Data
    </div>

    <form action="{{ url_for('thank_you') }}" method="POST" autocomplete="off">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="farmer_name">Farmer Name</label>
          <input id="farmer_name" name="name" type="text" required>
        </div>

      <div class="form-group">
  <label for="state">State</label>
  <select id="state" name="state" required>
    <option value="">-- Select State --</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
  </select>
</div>


        <div class="form-group">
          <label for="crop_type">Crop Type</label>
          <input id="crop_type" name="crop_type" type="text" placeholder="e.g. Rice, Wheat" required>
        </div>

        <div class="form-group">
          <label for="soil_moisture">Soil Moisture (%)</label>
          <input id="soil_moisture" name="soil_moisture" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="rainfall">Rainfall (mm)</label>
          <input id="rainfall" name="rainfall" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="irrigation">Irrigation Frequency (days/week)</label>
          <input id="irrigation" name="irrigation" type="number" min="1" max="7" required>
        </div>

        <div class="form-group">
          <label for="groundwater">Groundwater Level (m)</label>
          <input id="groundwater" name="groundwater" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="crop_water_requirement">Crop Water Requirement (L)</label>
          <input id="crop_water_requirement" name="crop_water_requirement" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="available_water">Available Water (L)</label>
          <input id="available_water" name="available_water" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="electricity">Electricity Usage (kWh)</label>
          <input id="electricity" name="electricity" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="temperature">Temperature (°C)</label>
          <input id="temperature" name="temperature" type="number" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="nash_payoff">Nash Payoff Value</label>
          <input id="nash_payoff" name="nash_payoff" type="number" step="0.01" required>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="model">Select Model</label>
          <select id="model" name="model" required>
            <option value="">-- Choose Model --</option>
            {% for model in models %}
              <option value="{{ model }}">{{ model }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <button type="submit" class="submit-btn">
        <i class="fa fa-tractor"></i> Submit & Predict
      </button>
    </form>
  </main>

  <footer class="footer">
    © 2025 CMR College of Engineering & Technology | Agricultural Water Overuse Prediction
  </footer>
</body>
</html>
