<!-- templates/predict.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Running Water Usage Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff, #ffffff);
            text-align: center;
            padding-top: 80px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0057d9;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .loading {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 6px solid #cce1ff;
            border-top: 6px solid #0057d9;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .link-btn {
            background: #0057d9;
            color: #fff;
            text-decoration: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }
        .link-btn:hover {
            background: #003f9e;
        }
        .nav {
            margin-top: 20px;
            font-size: 0.95rem;
        }
        .nav a {
            color: #0057d9;
            text-decoration: none;
            font-weight: 500;
        }
        .nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loading"></div>
        <h2>Analyzing Water Usage...</h2>
        <p>The system is processing your farm data using the selected model.  
           This may take a few seconds depending on the model complexity.</p>

        <a href="{{ url_for('thank_you') }}" class="link-btn">
            <i class="fa fa-chart-line"></i> View Results
        </a>

        <div class="nav">
            <a href="{{ url_for('home') }}"><i class="fa fa-home"></i> Back to Home</a>
        </div>
    </div>

</body>
</html>
